path_match_mode = "workspace_root"
expose_edit_scope = true
id = "mm-latest-correction"
title = "mm-latest-correction"
task = "修正决定：以 latest 参数为准，包括空字符串；不得因假值退回 initial，并修复 config.py。"
allowed_changes = ["config.py", "tests", "tests/*.py"]
required_changes = ["config.py"]
max_rounds = 8
max_context_chars = 16000
category = "memory"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "memory_latest_correction_used"]

[[steps]]
kind = "user_turn"
content = "初始决定使用 red。\n当前为非交互执行；已有信息足够时自主完成。确实缺少会改变结果的必要信息时，应明确报告无法继续，不能编造回答。调用 ask_user 将无法获得即时回答。\n本轮只确认并记住这条约束/决定，不修改文件、不运行测试；确认后结束本轮，等待下一条任务"

[[steps]]
kind = "user_turn"
content = "修正决定：以 latest 参数为准，包括空字符串；不得因假值退回 initial，并修复 config.py。\n当前为非交互执行；已有信息足够时自主完成。确实缺少会改变结果的必要信息时，应明确报告无法继续，不能编造回答。调用 ask_user 将无法获得即时回答。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
