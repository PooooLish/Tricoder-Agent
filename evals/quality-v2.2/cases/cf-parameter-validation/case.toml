path_match_mode = "workspace_root"
expose_edit_scope = true
id = "cf-parameter-validation"
title = "cf-parameter-validation"
task = "修复数量校验，只允许 1 到 100，并保持 service.py 的接口。"
allowed_changes = ["validator.py", "tests", "tests/*.py"]
required_changes = ["validator.py"]
max_rounds = 8
max_context_chars = 16000
category = "cross_file"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "修复数量校验，只允许 1 到 100，并保持 service.py 的接口。\n当前为非交互执行；已有信息足够时自主完成。确实缺少会改变结果的必要信息时，应明确报告无法继续，不能编造回答。调用 ask_user 将无法获得即时回答。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
