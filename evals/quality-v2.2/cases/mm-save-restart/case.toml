id = "mm-save-restart"
title = "mm-save-restart"
task = "保存并重启后继续使用前缀约束，修复 apply_prefix。"
allowed_changes = ["preferences.py"]
required_changes = ["preferences.py"]
max_rounds = 8
max_context_chars = 16000
category = "memory"
split = "holdout"
execution_kind = "contract"
scorers = ["behavior_assertions"]
faults = ["none"]
dimensions = ["behavior_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "memory_constraint_preserved"]

[[steps]]
kind = "user_turn"
content = "记住前缀 ID-。"

[[steps]]
kind = "memory_save"

[[steps]]
kind = "restart_session"

[[steps]]
kind = "user_turn"
content = "修复 preferences.py，并继续使用保存的前缀约束。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
