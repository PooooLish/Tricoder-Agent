path_match_mode = "workspace_root"
expose_edit_scope = true
id = "cf-backward-api"
title = "cf-backward-api"
task = "为 converter 增加旧 slugify API 兼容，同时保留 to_slug。"
allowed_changes = ["converter.py", "tests", "tests/*.py"]
required_changes = ["converter.py"]
max_rounds = 8
max_context_chars = 16000
category = "cross_file"
split = "holdout"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "为 converter 增加旧 slugify API 兼容，同时保留 to_slug。\n当前为非交互执行；已有信息足够时自主完成。确实缺少会改变结果的必要信息时，应明确报告无法继续，不能编造回答。调用 ask_user 将无法获得即时回答。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
