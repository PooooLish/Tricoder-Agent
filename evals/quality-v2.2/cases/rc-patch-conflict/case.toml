path_match_mode = "workspace_root"
expose_edit_scope = true
id = "rc-patch-conflict"
title = "rc-patch-conflict"
task = "修复 replace_tag：替换所有出现的 old 为 new，无匹配时保持原文。首次写操作会返回模拟上下文冲突，重读后继续。"
allowed_changes = ["tags.py", "tests", "tests/*.py"]
required_changes = ["tags.py"]
max_rounds = 8
max_context_chars = 16000
category = "recovery"
split = "holdout"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["patch_conflict"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "fault_triggered", "recovered"]

[[steps]]
kind = "user_turn"
content = "修复 replace_tag：替换所有出现的 old 为 new，无匹配时保持原文。首次写操作会返回模拟上下文冲突，重读后继续。\n当前为非交互执行；已有信息足够时自主完成。确实缺少会改变结果的必要信息时，应明确报告无法继续，不能编造回答。调用 ask_user 将无法获得即时回答。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
