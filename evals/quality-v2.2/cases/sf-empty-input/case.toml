path_match_mode = "workspace_root"
expose_edit_scope = true
id = "sf-empty-input"
title = "sf-empty-input"
task = "修复 mean，使空列表返回 0.0，非空列表仍计算平均值。"
allowed_changes = ["stats_ops.py", "tests", "tests/*.py"]
required_changes = ["stats_ops.py"]
max_rounds = 8
max_context_chars = 16000
category = "single_file"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "修复 mean，使空列表返回 0.0，非空列表仍计算平均值。\n当前为非交互执行；已有信息足够时自主完成。确实缺少会改变结果的必要信息时，应明确报告无法继续，不能编造回答。调用 ask_user 将无法获得即时回答。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
