path_match_mode = "workspace_root"
expose_edit_scope = true
id = "cf-module-interface"
title = "cf-module-interface"
task = "修复 formatter 模块接口，使 api.display(first,last) 正常工作：名字和姓氏之间用一个空格连接，并使用 title 大小写格式。"
allowed_changes = ["formatter.py", "tests", "tests/*.py"]
required_changes = ["formatter.py"]
max_rounds = 8
max_context_chars = 16000
category = "cross_file"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "修复 formatter 模块接口，使 api.display(first,last) 正常工作：名字和姓氏之间用一个空格连接，并使用 title 大小写格式。\n当前为非交互执行；已有信息足够时自主完成。确实缺少会改变结果的必要信息时，应明确报告无法继续，不能编造回答。调用 ask_user 将无法获得即时回答。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
