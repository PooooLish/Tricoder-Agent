path_match_mode = "workspace_root"
expose_edit_scope = true
id = "rc-search-truncated"
title = "rc-search-truncated"
task = "修复 find_prefix 为大小写不敏感；首次搜索结果会模拟截断。"
allowed_changes = ["searcher.py", "tests", "tests/*.py"]
required_changes = ["searcher.py"]
max_rounds = 8
max_context_chars = 16000
category = "recovery"
split = "holdout"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["tool_output_truncated"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "fault_triggered", "recovered"]

[[steps]]
kind = "user_turn"
content = "修复 find_prefix 为大小写不敏感；首次搜索结果会模拟截断。\n当前为非交互执行；已有信息足够时自主完成。确实缺少会改变结果的必要信息时，应明确报告无法继续，不能编造回答。调用 ask_user 将无法获得即时回答。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
