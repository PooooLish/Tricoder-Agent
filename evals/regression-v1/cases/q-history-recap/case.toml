id = "q-history-recap"
title = "Recall a prior read-only review"
task = "先只读审查 ledger.py，不修改文件；下一轮根据会话历史回顾。"
allowed_changes = []
required_changes = []
max_rounds = 10
max_context_chars = 40000
category = "memory"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier", "behavior_assertions"]
faults = ["none"]
dimensions = ["artifact_correct", "behavior_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]
assertions = ["history_recap_facts", "provider_called"]
expected_outcome = "completed"

[[steps]]
kind = "user_turn"
content = "只读审查 ledger.py 的用途，不修改文件，完成后调用 finish。"

[[steps]]
kind = "user_turn"
content = "回顾上一轮做了什么。报告必须包含 ledger.py、read_only_review、no_writes 三个证据标识，不要重新修改或声称运行了未运行的测试，然后调用 finish。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
