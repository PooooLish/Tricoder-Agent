id = "q-fix-regression"
title = "Fix cross-module argument forwarding without breaking the API"
task = "修复 formatter.py 到 core.py 的参数传递错误，保留 render(name, prefix='Hi') 公开接口，运行测试并调用 finish。"
allowed_changes = ["formatter.py", "core.py"]
required_changes = ["formatter.py"]
max_rounds = 10
max_context_chars = 40000
category = "cross_file"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier", "behavior_assertions"]
faults = ["none"]
dimensions = ["artifact_correct", "behavior_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]
assertions = ["provider_called"]
expected_outcome = "completed"

[[steps]]
kind = "user_turn"
content = "修复 formatter.py 到 core.py 的参数传递错误，保留 render(name, prefix='Hi') 公开接口，运行测试并调用 finish。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
