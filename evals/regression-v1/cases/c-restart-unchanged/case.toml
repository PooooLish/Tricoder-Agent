id = "c-restart-unchanged"
title = "Reuse an unchanged persistent workspace baseline"
task = "建立基线，重启同一会话后执行只读检查。"
allowed_changes = []
required_changes = []
max_rounds = 8
max_context_chars = 40000
category = "recovery"
split = "dev"
execution_kind = "contract"
scorers = ["hidden_verifier", "behavior_assertions"]
faults = ["none"]
dimensions = ["artifact_correct", "behavior_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]
assertions = ["baseline_reused", "provider_called"]
expected_outcome = "completed"

[[steps]]
kind = "user_turn"
content = "只读检查 app.py 并调用 finish。"

[[steps]]
kind = "restart_session"

[[steps]]
kind = "user_turn"
content = "再次只读检查 app.py 并调用 finish。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 10
