id = "cf-record-schema-compat"
title = "cf-record-schema-compat"
task = "records.normalize(record)及loader.load_records(text)：JSON列表，字段为字符串，v1 id/full_name、v2 id/name；输出只保留id/name；name存在时优先（包括空串）；缺两者抛ValueError，保留id、丢弃额外字段、不修改输入。"
allowed_changes = ["records.py", "loader.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "cross_file"
split = "holdout"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
expose_edit_scope = true
path_match_mode = "workspace_root"
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "records.normalize(record)及loader.load_records(text)：JSON列表，字段为字符串，v1 id/full_name、v2 id/name；输出只保留id/name；name存在时优先（包括空串）；缺两者抛ValueError，保留id、丢弃额外字段、不修改输入。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
