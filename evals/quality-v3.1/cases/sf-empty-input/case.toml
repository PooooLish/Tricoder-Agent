path_match_mode = "workspace_root"
expose_edit_scope = true
id = "sf-empty-input"
title = "sf-empty-input"
task = "stats_ops.mean：数字列表空时0.0，否则真实平均值；支持混合正负、小数和单元素，不修改输入。"
allowed_changes = ["stats_ops.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "single_file"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "stats_ops.mean：数字列表空时0.0，否则真实平均值；支持混合正负、小数和单元素，不修改输入。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
