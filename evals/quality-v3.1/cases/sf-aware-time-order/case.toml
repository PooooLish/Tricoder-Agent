id = "sf-aware-time-order"
title = "sf-aware-time-order"
task = "time_order.sort_events(events)：记录timestamp为带Z或±HH:MM偏移的合法ISO8601时间；按UTC时刻升序，相同时稳定，空列表可用；不修改输入列表或记录内容。"
allowed_changes = ["time_order.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "single_file"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
expose_edit_scope = true
path_match_mode = "workspace_root"
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "time_order.sort_events(events)：记录timestamp为带Z或±HH:MM偏移的合法ISO8601时间；按UTC时刻升序，相同时稳定，空列表可用；不修改输入列表或记录内容。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
