[[steps]]
kind = "user_turn"
content = "textkit.core.normalize_label已实现strip+lower且只读；包textkit同时导出新normalize_label及旧clean_label，report.label_line使用新导出输出label=<结果>；修实际导入链，空串可用。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

