path_match_mode = "workspace_root"
expose_edit_scope = true
id = "rc-provider-transient"
title = "rc-provider-transient"
task = "counter.increment：任何整数加1，包括负数、零、大整数。本题无故障注入，仅评分业务正确性；保留题ID用于追溯。"
allowed_changes = ["counter.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "single_file"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "counter.increment：任何整数加1，包括负数、零、大整数。本题无故障注入，仅评分业务正确性；保留题ID用于追溯。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
