id = "cf-config-precedence"
title = "cf-config-precedence"
task = "settings.resolve(defaults,file_values,cli_values)合并为新dict：defaults < file < cli，只有缺键才回退，0/False/空串/None均是显式值，不修改任何输入；app.build_settings使用公开默认值port=8000,debug=False,label='app',token=None。"
allowed_changes = ["settings.py", "app.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "cross_file"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
expose_edit_scope = true
path_match_mode = "workspace_root"
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "settings.resolve(defaults,file_values,cli_values)合并为新dict：defaults < file < cli，只有缺键才回退，0/False/空串/None均是显式值，不修改任何输入；app.build_settings使用公开默认值port=8000,debug=False,label='app',token=None。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
