path_match_mode = "workspace_root"
expose_edit_scope = true
id = "rc-search-truncated"
title = "rc-search-truncated"
task = "searcher.find_prefix(values,prefix)：ASCII前缀忽略大小写，保留原拼写、顺序及重复项；空前缀返回全部，空列表为空。首次匹配read_file/search_text/glob工具可能返回模拟OUTPUT_LIMIT，请根据工具反馈继续读取/搜索；不要在业务代码实现截断或第一次少返回。"
allowed_changes = ["searcher.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "recovery"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["tool_output_truncated"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "fault_triggered", "recovered"]

[[steps]]
kind = "user_turn"
content = "searcher.find_prefix(values,prefix)：ASCII前缀忽略大小写，保留原拼写、顺序及重复项；空前缀返回全部，空列表为空。首次匹配read_file/search_text/glob工具可能返回模拟OUTPUT_LIMIT，请根据工具反馈继续读取/搜索；不要在业务代码实现截断或第一次少返回。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
