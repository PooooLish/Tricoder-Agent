path_match_mode = "workspace_root"
expose_edit_scope = true
id = "mm-early-constraint"
title = "mm-early-constraint"
task = "实现renderer.render(text,color)，输出[color]text[/color]；使用传入颜色，保留text原样。遵守前轮约束。"
allowed_changes = ["renderer.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "memory"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "memory_constraint_preserved"]

[[steps]]
kind = "user_turn"
content = "记住约束：渲染器必须使用调用者传入的颜色，保留文本。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n本轮只确认并记住这条约束/决定，不修改文件、不运行测试；调用finish结束本轮，等待下一条任务。"

[[steps]]
kind = "user_turn"
content = "实现renderer.render(text,color)，输出[color]text[/color]；使用传入颜色，保留text原样。遵守前轮约束。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
