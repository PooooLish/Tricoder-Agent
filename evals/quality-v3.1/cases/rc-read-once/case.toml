path_match_mode = "workspace_root"
expose_edit_scope = true
id = "rc-read-once"
title = "rc-read-once"
task = "parser.parse_number解析合法有符号十进制整数文本，支持首尾空白。模拟首次read_file失败属于工具信号，继续完成业务修复；不评分非法文本。"
allowed_changes = ["parser.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "recovery"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["tool_transient_read"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "fault_triggered", "recovered"]

[[steps]]
kind = "user_turn"
content = "parser.parse_number解析合法有符号十进制整数文本，支持首尾空白。模拟首次read_file失败属于工具信号，继续完成业务修复；不评分非法文本。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
