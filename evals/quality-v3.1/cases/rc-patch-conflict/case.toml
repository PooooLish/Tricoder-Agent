path_match_mode = "workspace_root"
expose_edit_scope = true
id = "rc-patch-conflict"
title = "rc-patch-conflict"
task = "tags.replace_tag(text,old,new)替换所有出现；old非空，new可为空，无匹配不变。首次写失败是模拟工具冲突，业务不包含重试计数。"
allowed_changes = ["tags.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "recovery"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["patch_conflict"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "fault_triggered", "recovered"]

[[steps]]
kind = "user_turn"
content = "tags.replace_tag(text,old,new)替换所有出现；old非空，new可为空，无匹配不变。首次写失败是模拟工具冲突，业务不包含重试计数。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
