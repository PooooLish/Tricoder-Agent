path_match_mode = "workspace_root"
expose_edit_scope = true
id = "cf-update-caller"
title = "cf-update-caller"
task = "calculator.multiply已正确且只读；只修report.product_line调用，返回product=<a*b>，支持负数和零。"
allowed_changes = ["report.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "cross_file"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "calculator.multiply已正确且只读；只修report.product_line调用，返回product=<a*b>，支持负数和零。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
