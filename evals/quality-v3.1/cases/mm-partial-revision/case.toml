id = "mm-partial-revision"
title = "mm-partial-revision"
task = "修正formatter.render(text,prefix)：正文strip后再lower；撤回prefix功能并忽略其值，但保留prefix参数签名和strip行为。完成并验证本轮修改。"
allowed_changes = ["formatter.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "memory"
split = "holdout"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
expose_edit_scope = true
path_match_mode = "workspace_root"
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed"]

[[steps]]
kind = "user_turn"
content = "实现formatter.render(text,prefix)：返回prefix+text.strip()，正文保留大小写；本轮需要实际修改、验证并finish。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[steps]]
kind = "user_turn"
content = "修正formatter.render(text,prefix)：正文strip后再lower；撤回prefix功能并忽略其值，但保留prefix参数签名和strip行为。完成并验证本轮修改。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
