path_match_mode = "workspace_root"
expose_edit_scope = true
id = "mm-latest-correction"
title = "mm-latest-correction"
task = "修正决定：config.select(initial,latest)始终选择latest，包含空字符串，不因假值回退initial。"
allowed_changes = ["config.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "memory"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["none"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "memory_latest_correction_used"]

[[steps]]
kind = "user_turn"
content = "初始决定使用 red。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n本轮只确认并记住这条约束/决定，不修改文件、不运行测试；调用finish结束本轮，等待下一条任务。"

[[steps]]
kind = "user_turn"
content = "修正决定：config.select(initial,latest)始终选择latest，包含空字符串，不因假值回退initial。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
