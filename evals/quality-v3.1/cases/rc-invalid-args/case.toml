path_match_mode = "workspace_root"
expose_edit_scope = true
id = "rc-invalid-args"
title = "rc-invalid-args"
task = "normalize.normalize字符串首尾去空白并小写，内部空白保留，空白串为空。首次写操作错误为模拟注入信号，不表示实际参数有误；修复业务即可。"
allowed_changes = ["normalize.py", "tests/*.py"]
required_changes = ["*.py"]
max_rounds = 16
max_context_chars = 16000
category = "recovery"
split = "dev"
execution_kind = "quality"
scorers = ["hidden_verifier"]
faults = ["tool_invalid_args"]
dimensions = ["artifact_correct", "agent_completed", "scope_compliant", "cleanup_confirmed", "fault_triggered", "recovered"]

[[steps]]
kind = "user_turn"
content = "normalize.normalize字符串首尾去空白并小写，内部空白保留，空白串为空。首次写操作错误为模拟注入信号，不表示实际参数有误；修复业务即可。\n当前为非交互执行；已有信息足够时自主完成，必要信息确实缺失时明确报告，不能编造；ask_user无法即时获得回答。\n可在允许范围自行补测试。运行公开测试及当前验证要求后，明确调用finish交付；不要只提供建议。"

[[verification]]
name = "hidden"
command = "python -m unittest discover -s .tricoder_eval_verifier -q"
timeout = 20
